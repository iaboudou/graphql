query data {
  # Basic user identification
  a:user{
    login
    avatarUrl
    firstName
    lastName
    email
    attrs
  }

  # XP amount
  b: transaction_aggregate (where: {type : {_eq: "xp"}}){
  	aggregate{
      sum{amount}
    }
  }
  
  # level
  c: transaction(where: {type: {_eq: "level"}}, order_by: {id : desc}, limit: 1) {
		amount
  }
}